<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>ESSENCE Wi-Fi</title>
<link rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#8e97ea;--ice:#7fe9ff;--mute:#9aa0c8;--t:#eef0ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 70% at 50% -10%,#1a1e4a,#05060c 62%) #05060c;color:var(--t);font-family:Gotham,"Gotham SSm",Montserrat,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:18px;padding:max(26px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom))}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{text-align:center}
#lg{width:132px;height:auto;filter:drop-shadow(0 0 16px rgba(142,151,234,.6));animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 30px rgba(127,233,255,.7))}}
#t{display:block;margin-top:6px;font-size:clamp(46px,16vw,66px);font-weight:200;letter-spacing:-.02em;line-height:1}
#t small{font-size:.32em;font-weight:600;color:var(--ice);margin-left:6px;letter-spacing:0}
#d{margin-top:8px;font-size:13px;color:var(--mute)}
h1{font-size:15px;font-weight:600}
.lead{font-size:12.5px;color:var(--mute);margin-top:3px}
#nets{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.net{display:grid;grid-template-columns:auto 1fr auto;gap:0 14px;align-items:center;padding:16px;border-radius:26px;background:linear-gradient(150deg,rgba(142,151,234,.18),rgba(255,255,255,.03));border:1px solid rgba(142,151,234,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--p);border:1px solid rgba(142,151,234,.45);background:rgba(142,151,234,.1)}
.net h2{font-size:17px;font-weight:700;letter-spacing:.01em}
.net p{font-size:12px;color:var(--mute);margin-top:2px}
.btn{font:inherit;font-weight:700;font-size:13px;color:#080a1c;background:linear-gradient(135deg,var(--p),var(--ice));border:0;border-radius:999px;padding:12px 20px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.94)}
.btn.ghost{color:var(--t);background:transparent;border:1px solid rgba(255,255,255,.28)}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.msg{grid-column:1/-1;display:none;gap:9px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;line-height:1.5;color:#c9cdf5}
.msg.show{display:flex}.msg svg{width:18px;height:18px;margin-top:1px}
.net.deny{border-color:rgba(255,130,150,.5)}.net.deny .msg{color:#ff9fb0}
.shake{animation:sh .45s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.tile.w{grid-column:1/-1}
.tile .l{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mute)}
.tile .l svg{width:16px;height:16px;color:var(--p)}
.tile b{display:block;margin-top:8px;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:9px;overflow:hidden}
#bf{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--ice));transition:width .6s}
footer{margin-top:auto;padding-top:10px;display:flex;justify-content:center;align-items:center;gap:7px;font-size:12.5px;color:var(--mute)}
footer svg{width:15px;height:15px}
footer a{color:var(--p);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
@media(prefers-reduced-motion:reduce){#lg{animation:none}.shake{animation:none}}
</style>
</head>

<plist version="1.0"><dict><key>PayloadDisplayName</key><string>${E(n.ssid)}</string><key>PayloadIdentifier</key><string>${id}</string><key>PayloadType</key><string>Configuration</string><key>PayloadUUID</key><string>${U()}</string><key>PayloadVersion</key><integer>1</integer><key>PayloadContent</key><array><dict><key>PayloadType</key><string>com.apple.wifi.managed</string><key>PayloadIdentifier</key><string>${id}.net</string><key>PayloadUUID</key><string>${U()}</string><key>PayloadVersion</key><integer>1</integer><key>PayloadDisplayName</key><string>${E(n.ssid)}</string><key>SSID_STR</key><string>${E(n.ssid)}</string><key>HIDDEN_NETWORK</key><false/><key>AutoJoin</key><true/><key>EncryptionType</key><string>${w?n.sec:'None'}</string>${w?`<key>Password</key><string>${E(n.pass)}</string>`:''}</dict></array></dict></plist>`}

async function join(c,n){
 if(IOS){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([cfg(n)],{type:'application/x-apple-aspen-config'}));a.download=n.ssid+'.mobileconfig';document.body.appendChild(a);a.click();a.remove();
  say(c,'info','Profile ready. Tap Allow, then open Settings, Profile Downloaded, Install.');return}
 try{if(n.pass)await navigator.clipboard.writeText(n.pass)}catch(e){}
 say(c,'info',(n.pass?'Password copied. ':'')+'Choose '+n.ssid+' in the Wi-Fi list'+(n.pass?' and paste it.':'.'));
 if(AND)setTimeout(()=>{location.href='intent:#Intent;action=android.settings.WIFI_SETTINGS;end'},700)}

/* live time */
function tick(){const d=new Date();$('#t').innerHTML=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}).replace(/\s?[AP]M/i,'')+'<small>'+String(d.getSeconds()).padStart(2,'0')+'</small>';$('#d').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,1000);

/* device name */
(async()=>{let n='This device';
 if(IOS)n=/iPad/.test(UA)||!/iPhone/.test(UA)?'iPad':'iPhone';
 else if(AND){n=(UA.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/)||[])[1]||'Android phone';
  try{const h=await navigator.userAgentData.getHighEntropyValues(['model']);if(h.model)n=h.model}catch(e){}}
 else if(/Windows/.test(UA))n='Windows PC';else if(/Mac/.test(UA))n='Mac';else if(/Linux/.test(UA))n='Linux device';
 $('#dev').textContent=n})();

/* battery (Chrome/Android; iOS does not expose it) */
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>{const p=Math.round(b.level*100);$('#bp').textContent=p+'%'+(b.charging?' charging':'');$('#bf').style.width=p+'%'};f();b.onlevelchange=b.onchargingchange=f}).catch(()=>{});

/* MAC: browsers cannot read it; shown only if the router/portal passes it as ?mac=XX:XX... */
{const q=new URLSearchParams(location.search),m=q.get('mac')||q.get('clientmac')||q.get('client_mac');if(m)$('#mac').textContent=m.toUpperCase()}

/* floating-object background */
const cv=$('#bg'),x=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches,
 COL=['142,151,234','127,233,255','176,140,255'];let W,H,D,O=[],px=0,py=0,tx=0,ty=0;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
function mk(){return{x:Math.random()*W,y:Math.random()*H,r:14+Math.random()*56,vx:(Math.random()-.5)*.3,vy:-.12-Math.random()*.35,a:Math.random()*6.28,va:(Math.random()-.5)*.012,k:Math.random()*4|0,c:COL[Math.random()*3|0],z:.35+Math.random()*.65}}
rs();for(let i=0;i<30;i++)O.push(mk());addEventListener('resize',rs);
addEventListener('pointermove',e=>{tx=e.clientX/W*2-1;ty=e.clientY/H*2-1});
function draw(){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';px+=(tx-px)*.05;py+=(ty-py)*.05;
 for(const o of O){if(!RM){o.x+=o.vx*o.z;o.y+=o.vy*o.z;o.a+=o.va}
  if(o.y<-90)o.y=H+90;if(o.x<-90)o.x=W+90;if(o.x>W+90)o.x=-90;
  x.save();x.translate(o.x+px*o.z*34,o.y+py*o.z*34);x.rotate(o.a);x.lineWidth=1.4+o.z;x.strokeStyle=`rgba(${o.c},${.18+.4*o.z})`;
  if(o.k==0){const g=x.createRadialGradient(0,0,0,0,0,o.r);g.addColorStop(0,`rgba(${o.c},.32)`);g.addColorStop(1,`rgba(${o.c},0)`);x.fillStyle=g;x.beginPath();x.arc(0,0,o.r,0,6.3);x.fill()}
  else if(o.k==1){x.beginPath();x.arc(0,0,o.r*.55,0,6.3);x.stroke()}
  else{const n=o.k==2?6:3;x.beginPath();for(let i=0;i<n;i++){const a=i/n*6.283;x[i?'lineTo':'moveTo'](Math.cos(a)*o.r*.6,Math.sin(a)*o.r*.6)}x.closePath();x.stroke()}
  x.restore()}
 if(!RM)requestAnimationFrame(draw)}
draw();
</script>
